<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>IBRAZ Intelligence</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#05070D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Intelligence">
<script>(function(){var t="dark";try{var s=localStorage.getItem("ibraz-theme");if(s==="light"||s==="dark")t=s;}catch(e){}document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#05070D;--band:#090D17;--card:#0E1320;--line:#1A2132;--line2:#273048;
  --fg:#F2F5FA;--muted:#9AA4B8;--faint:#687389;
  --gold:#4DA8FF;--blue:#2F7BFF;--cyan:#5BE1FF;--violet:#A78BFF;
  --up:#4ADE9A;--down:#FF6B6B;--warn:#F5B544;
  --glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);--gline:rgba(255,255,255,.09);
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'Manrope',ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ink:#F4F6FB;--band:#EDF1F8;--card:#FFFFFF;--line:#DFE5EF;--line2:#C9D2E1;
  --fg:#0B1220;--muted:#4B5870;--faint:#7A869B;--gold:#1F6FEB;
  --up:#0E9F5B;--down:#E03E3E;--warn:#C27A06;
  --glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.9);--gline:rgba(11,18,32,.08);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:12.5px}
[hidden]{display:none!important}

/* ================= Lock screen ================= */
.lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 34px) 24px calc(var(--safe-b) + 22px);overflow:hidden;color:#fff;background:#03050B;transition:transform .7s cubic-bezier(.7,0,.2,1),opacity .6s ease}
.lock.out{transform:translateY(-104%);opacity:.4;pointer-events:none}
.lk-bg{position:absolute;inset:-20%;z-index:-1;filter:blur(60px) saturate(140%)}
.lk-bg i{position:absolute;border-radius:50%;opacity:.75;animation:blob 18s ease-in-out infinite alternate}
.lk-bg i:nth-child(1){width:60vmax;height:60vmax;left:-10%;top:-12%;background:radial-gradient(circle,#2F7BFF,transparent 65%)}
.lk-bg i:nth-child(2){width:55vmax;height:55vmax;right:-14%;top:22%;background:radial-gradient(circle,#6E6BFF,transparent 65%);animation-duration:22s;animation-delay:-6s}
.lk-bg i:nth-child(3){width:50vmax;height:50vmax;left:10%;bottom:-20%;background:radial-gradient(circle,#0FB6D8,transparent 65%);animation-duration:26s;animation-delay:-12s}
@keyframes blob{50%{transform:translate(6%,8%) scale(1.12)}100%{transform:translate(-6%,-4%) scale(.95)}}
.lk-top{text-align:center}
.lk-icon{width:22px;height:22px;opacity:.9}
.lk-icon .shackle{transition:transform .45s cubic-bezier(.3,1.6,.5,1);transform-origin:16px 9px}
.lock.opening .lk-icon .shackle{transform:translate(4px,-3px) rotate(18deg)}
.lk-time{font:700 clamp(72px,22vw,104px)/1 var(--display);letter-spacing:-.04em;margin-top:8px;text-shadow:0 8px 40px rgba(0,0,0,.25)}
.lk-date{font:600 17px var(--body);opacity:.85;margin-top:6px}
.lk-mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.lk-brand{font:500 12px var(--mono);letter-spacing:.24em;text-transform:uppercase;opacity:.8}
.lk-brand b{font-weight:600;color:#9FD3FF}
.lk-msg{font:600 17px var(--body);min-height:24px}
.lk-sub{font-size:13px;opacity:.7;max-width:300px;min-height:18px;margin-top:-8px}
.dots{display:flex;gap:16px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.6px solid rgba(255,255,255,.85);transition:background .15s,transform .15s}
.dots i.on{background:#fff;transform:scale(1.05)}
.dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;justify-content:center;margin-top:6px}
.key{width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.key:active,.key.hit{background:rgba(255,255,255,.42);transition:none}
.key b{font:500 32px/1 var(--body)}
.key small{font:600 9.5px var(--body);letter-spacing:.2em;opacity:.8;margin-top:2px;min-height:11px}
.key.ghost{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.key.ghost:active{background:rgba(255,255,255,.12)}
.key svg{width:34px;height:34px}
.lk-foot{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13.5px}
.lk-foot button,.lk-foot a{background:none;border:0;color:#fff;opacity:.8;text-decoration:none;padding:6px 10px}
.lk-foot button:hover,.lk-foot a:hover{opacity:1}
.faceid{width:58px;height:58px;color:#fff}
.faceid path{fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.scan .faceid .corner{animation:corner 1.1s ease-in-out infinite}
@keyframes corner{50%{opacity:.35}}
.faceid.ok{color:#4ADE9A}
.facebig{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:#fff;padding:10px}
.offer{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6px}
.btn-w{border:0;border-radius:999px;padding:14px 26px;font-weight:700;background:#fff;color:#05070D;min-width:220px}
.btn-g{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 24px;background:rgba(255,255,255,.08);color:#fff;min-width:220px}
@media (max-height:700px){.lk-time{font-size:64px}.pad{gap:12px 22px;grid-template-columns:repeat(3,70px)}.key{width:70px;height:70px}}

/* ================= App shell ================= */
.app{min-height:100%;opacity:0;transform:scale(.97);transition:opacity .5s .15s,transform .6s .1s cubic-bezier(.2,.8,.2,1)}
.app.in{opacity:1;transform:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 90% -10%,rgba(47,123,255,.16),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(110,107,255,.12),transparent 60%)}
.ah{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--safe-t) + 12px) 18px 12px;background:color-mix(in srgb,var(--ink) 70%,transparent);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid var(--gline)}
.ah-l{display:flex;align-items:center;gap:10px;font:800 17px var(--display);letter-spacing:.04em}
.ah-l b{font-weight:500;color:var(--gold);letter-spacing:0}
.ah-l svg{width:28px;height:28px}
.ah-r{display:flex;align-items:center;gap:8px}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gline);background:var(--glass);color:var(--fg)}
.ibtn svg{width:19px;height:19px}
.live{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--muted);padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--gline);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.live.ok i{background:var(--up);box-shadow:0 0 0 0 rgba(74,222,154,.6);animation:pulse 2s infinite}
.live.bad i{background:var(--down)}
@keyframes pulse{70%{box-shadow:0 0 0 6px transparent}}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--safe-b) + 110px)}
.view{display:none;animation:vin .45s cubic-bezier(.2,.8,.2,1)}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
h1{font:700 30px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 4px}
h2{font:700 19px var(--display);margin:0}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.card{position:relative;background:var(--glass);border:1px solid var(--gline);border-radius:22px;padding:18px;margin-bottom:14px;-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 40px -30px rgba(0,0,0,.8)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.big{font:700 clamp(34px,9vw,46px)/1.05 var(--display);letter-spacing:-.025em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.kv{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:rgba(127,127,127,.07);border:1px solid var(--gline)}
.kv span{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.kv b{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:600 11.5px var(--body);background:rgba(127,127,127,.12);color:var(--muted);white-space:nowrap}
.chip.g{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.chip.r{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.chip.y{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.b{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,#2F7BFF,#4DA8FF 60%,#5BE1FF);color:#fff;box-shadow:0 10px 24px -12px rgba(47,123,255,.8)}
.btn.sec{background:var(--glass2);color:var(--fg);border:1px solid var(--gline);box-shadow:none}
.btn.dan{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn.full{width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--gline);background:rgba(0,0,0,.25);color:var(--fg);font:500 16px var(--mono);outline:none;-webkit-appearance:none;appearance:none}
[data-theme="light"] .inp{background:#fff}
textarea.inp{font-family:var(--body);min-height:70px;resize:vertical}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent)}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(127,127,127,.1);border:1px solid var(--gline)}
.seg button{flex:1;border:0;background:none;padding:9px 10px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--glass2);color:var(--fg);box-shadow:0 4px 12px -6px rgba(0,0,0,.5)}
.seg.side button.on[data-v="buy"]{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up)}
.seg.side button.on[data-v="sell"]{background:color-mix(in srgb,var(--down) 22%,transparent);color:var(--down)}
.form{display:grid;gap:12px}
.form .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.inp{min-width:0}
.sh-card,.view{overflow-x:hidden}
.note{font-size:12.5px;color:var(--faint);margin:10px 0 0}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:50%;bottom:calc(var(--safe-b) + 12px);transform:translateX(-50%);z-index:20;display:flex;gap:2px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--card) 62%,transparent);border:1px solid var(--gline);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 18px 40px -16px rgba(0,0,0,.8);width:min(calc(100% - 24px),520px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);padding:8px 2px 6px;border-radius:20px;font:600 10.5px var(--body);position:relative;z-index:1;transition:color .25s}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--fg)}
.tab-lens{position:absolute;top:6px;bottom:6px;left:0;border-radius:20px;background:linear-gradient(135deg,rgba(47,123,255,.55),rgba(91,225,255,.35));box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s}
[data-theme="light"] .tab-lens{background:linear-gradient(135deg,rgba(47,123,255,.22),rgba(91,225,255,.18))}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet.on{opacity:1;pointer-events:auto}
.sh-card{width:min(100%,560px);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--gline);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(var(--safe-b) + 22px);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.sheet.on .sh-card{transform:none}
.sh-grab{width:40px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 14px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
@media (min-width:700px){.sheet{align-items:center}.sh-card{border-radius:26px;border-bottom:1px solid var(--gline)}}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);z-index:60;transform:translate(-50%,-140%);padding:12px 18px;border-radius:18px;background:color-mix(in srgb,var(--card) 85%,transparent);border:1px solid var(--gline);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 18px 40px -16px rgba(0,0,0,.7);font-weight:600;font-size:14px;transition:transform .5s cubic-bezier(.3,1.3,.5,1);max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0)}

/* home */
.hero-c{overflow:hidden}
.hero-c::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(47,123,255,.35),transparent 70%);pointer-events:none}
.alloc{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.donut{width:150px;height:150px}
.donut circle{fill:none;transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1),stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.legend{display:grid;gap:8px}
.legend div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend em{font-style:normal;font:500 12.5px var(--mono);color:var(--muted)}
.hold{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--gline)}
.hold:first-child{border-top:0}
.hold b{font:700 15px var(--display)}
.hold .r{text-align:right;font:600 14px var(--mono)}
.hold small{color:var(--muted);font-size:12px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:18px;border:1px solid var(--gline);background:var(--glass);font:600 12.5px var(--body);color:var(--fg)}
.qa svg{width:22px;height:22px;color:var(--gold)}

/* plan */
.bar{position:relative;height:10px;border-radius:6px;background:rgba(127,127,127,.14);overflow:visible;margin:8px 0 4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--fg);opacity:.75;transition:left .9s}
.bk{padding:12px 0;border-top:1px solid var(--gline)}
.bk:first-of-type{border-top:0}
.bk-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bk-h b{font:700 15px var(--display);display:flex;align-items:center;gap:8px}
.bk-h b i{width:10px;height:10px;border-radius:3px}
.bk-in{display:flex;align-items:center;gap:6px}
.bk-in input{width:64px;padding:6px 8px;font-size:14px;text-align:right}
.sched{width:100%;border-collapse:collapse;font-size:13px}
.sched th{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:6px 4px}
.sched td{padding:10px 4px;border-top:1px solid var(--gline);font-family:var(--mono);font-size:12.5px}
.sched tr.done td{opacity:.45}
.sched tr.next td{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.ck{width:22px;height:22px;accent-color:var(--gold)}
.prog{height:8px;border-radius:5px;background:rgba(127,127,127,.15);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2F7BFF,#5BE1FF);border-radius:5px;transition:width 1s}

/* risk */
.ladder{position:relative;height:150px;margin:6px 0 4px;border-radius:16px;background:rgba(127,127,127,.06);border:1px solid var(--gline);overflow:hidden}
.ladder .zone{position:absolute;left:0;right:0;transition:top .5s,height .5s}
.ladder .zone.win{background:linear-gradient(180deg,color-mix(in srgb,var(--up) 26%,transparent),color-mix(in srgb,var(--up) 6%,transparent))}
.ladder .zone.loss{background:linear-gradient(0deg,color-mix(in srgb,var(--down) 26%,transparent),color-mix(in srgb,var(--down) 6%,transparent))}
.ladder .ln{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--fg);transition:top .5s}
.ladder .ln span{position:absolute;right:10px;transform:translateY(-50%);font:600 11.5px var(--mono);padding:3px 8px;border-radius:8px;background:var(--card);border:1px solid var(--gline)}
.ladder .ln.e{border-top-style:solid;border-color:var(--gold)}
.res-big{font:700 28px/1.1 var(--display);letter-spacing:-.02em}
.warn{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);font-size:13px;font-weight:600;margin-top:10px}

/* journal */
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:13px 0;border-top:1px solid var(--gline);cursor:pointer}
.tr:first-child{border-top:0}
.tr .sd{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:700 11px var(--mono)}
.tr .sd.buy{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.tr .sd.sell{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.tr b{font:700 15px var(--display)}
.tr small{display:block;color:var(--muted);font-size:12px}
.tr .r{text-align:right;font:600 13.5px var(--mono)}

/* ---------- crypto: AES-GCM vault, key wrapped by PIN and (optionally) Face ---------- */
async function pinKey(pin, salt){

function idb(){ return new Promise(function(res, rej){ var r = indexedDB.open('ibraz-intelligence', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('keys'); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }

async function idbDel(k){ try{ var db = await idb(); db.transaction('keys', 'readwrite').objectStore('keys').delete(k); }catch(e){} }

var META = lsGet(K_META), DEK = null, RAW = null, V = null;
function saveMeta(){ lsSet(K_META, META); }
async function saveVault(){ if(!DEK || !V) return; var box = await seal(DEK, te.encode(JSON.stringify(V))); lsSet(K_VAULT, box); }
var saveT; function save(){ clearTimeout(saveT); saveT = setTimeout(saveVault, 150); }

/* ---------- Face unlock (passkeys / WebAuthn) ---------- */
var FACE_OK = false;
(async function(){ try{ FACE_OK = !!(window.PublicKeyCredential && window.isSecureContext && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ FACE_OK = false; } paintLock(); })();
async function faceAssert(id, salt){

    user: {id: rnd(16), name: 'IBRAZ Intelligence', displayName: 'IBRAZ Intelligence'},

var mode = 'pin', entry = '', firstPin = '', busy = false;

async function tryPin(pin){

async function createVault(pin){
  RAW = rnd(32);

  DEK = await crypto.subtle.importKey('raw', RAW, 'AES-GCM', false, ['encrypt', 'decrypt']);
  var box = lsGet(K_VAULT);
  V = box ? JSON.parse(td.decode(await unseal(DEK, box))) : defaults();
  V = Object.assign(defaults(), V);
  open();
}

  if(lockedOut()){ paintLock(); return; }
  busy = true; $('lkFaceWrap').classList.add('scan'); msg('Looking for your face…', '');
  try{
    var f = META.face, out = await faceAssert(f.id, f.mode === 'prf' ? unb64(f.salt) : null), key;
    if(f.mode === 'prf'){ if(!out) throw new Error('This device did not return a face key. Use your PIN.'); key = await prfKey(out); }
    else { key = await idbGet('face'); if(!key) throw new Error('Face key missing on this device. Use your PIN, then turn Face on again.'); }

async function restoreWith(j, pin){
  try{
    var k = await pinKey(pin, unb64(j.meta.salt)), raw = await unseal(k, j.meta.pinWrap);

    return true;
  }catch(e){ return false; }

var BUCKETS = [
  {k:'BTC', name:'Bitcoin', c:'#F5B544'},
  {k:'ETH', name:'Ethereum', c:'#A78BFF'},
  {k:'Alts', name:'Other coins', c:'#5BE1FF'},
  {k:'Cash', name:'Cash & stablecoins', c:'#7C8CA8'}
];
var STABLE = {USDT:1, USDC:1, FDUSD:1, IDR:1};
var EXCH = ['Indodax', 'Binance', 'Triv'];
function defaults(){
  var d = new Date(); d.setDate(d.getDate() + 30);
  return {
    v:1, capital: 10000000, deposits: [{d: today(), amt: 10000000, note:'Starting capital'}],
    target: {BTC:50, ETH:20, Alts:10, Cash:20},
    sched: {amount: 100000000, start: ymd(d), n: 10, every: 'week', done: {}, received: false},
    trades: [], watch: ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'DOGE'], alerts: [],
    fees: {Indodax: {fee:.3, tax:.21}, Binance: {fee:.1, tax:1}, Triv: {fee:.3, tax:.21}},
    risk: 1, autolock: 5
  };
}
function bucketOf(a){ return a === 'BTC' ? 'BTC' : a === 'ETH' ? 'ETH' : STABLE[a] ? 'Cash' : 'Alts'; }
function capital(){ return (V.deposits || []).reduce(function(s, d){ return s + (+d.amt || 0); }, 0); }
function book(){
  var pos = {}, cash = capital(), realized = 0, fees = 0, wins = 0, sells = 0, curve = [];
  var ts = V.trades.slice().sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : a.at - b.at; });
  ts.forEach(function(t){
    var p = pos[t.a] = pos[t.a] || {qty:0, cost:0}, gross = t.qty * t.px, fee = +t.fee || 0;
    fees += fee;
    if(t.side === 'buy'){ p.qty += t.qty; p.cost += gross + fee; cash -= gross + fee; t._pnl = null; }
    else {
      var avg = p.qty > 0 ? p.cost / p.qty : t.px, q = Math.min(t.qty, p.qty || t.qty), basis = avg * q;
      var pnl = gross - fee - basis; t._pnl = pnl; t._avg = avg;
      p.qty = Math.max(0, p.qty - t.qty); p.cost = Math.max(0, p.cost - basis); if(p.qty < 1e-12){ p.qty = 0; p.cost = 0; }
      cash += gross - fee; realized += pnl; sells++; if(pnl > 0) wins++;
      curve.push({d: t.d, v: realized});
    }
  });
  return {pos: pos, cash: cash, realized: realized, fees: fees, wins: wins, sells: sells, curve: curve};
}
function feePct(ex, side){ var f = V.fees[ex] || {fee:0, tax:0}; return ((+f.fee || 0) + (side === 'sell' ? (+f.tax || 0) : 0)) / 100; }

/* ---- tween numbers ---- */
function tween(el, to, fmt){
  if(!el) return; var from = +el.getAttribute('data-v'); el.setAttribute('data-v', to);
  if(RM || isNaN(from) || from === to){ el.textContent = fmt(to); return; }
  var t0 = performance.now();
  (function step(now){ var k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if(k < 1) requestAnimationFrame(step); })(t0);
}

/* ---------- HOME ---------- */
function portfolio(){
  var b = book(), rows = [], val = 0, day = 0, byB = {BTC:0, ETH:0, Alts:0, Cash: Math.max(0, b.cash)}, missing = false;
  Object.keys(b.pos).forEach(function(a){
    var p = b.pos[a]; if(p.qty <= 0) return;
    var price = px(a), v = price != null ? p.qty * price : null;
    if(v == null){ missing = true; v = p.cost; }
    var ch = MK.t[a] ? MK.t[a].ch : 0;
    val += v; day += v - v / (1 + ch / 100);
    byB[bucketOf(a)] += v;
    rows.push({a: a, qty: p.qty, v: v, avg: p.cost / p.qty, cost: p.cost, upnl: v - p.cost, ch: ch});
  });
  rows.sort(function(x, y){ return y.v - x.v; });
  var total = val + Math.max(0, b.cash);
  return {b: b, rows: rows, total: total, invested: val, day: day, byB: byB, cap: capital(), missing: missing};
}
function donut(byB, total, target){
  var R = 62, C = 2 * Math.PI * R, r2 = 48, C2 = 2 * Math.PI * r2, off = 0, off2 = 0, h = '';
  h += '<svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Allocation, actual outside, target inside"><g transform="rotate(-90 75 75)">';
  h += '<circle cx="75" cy="75" r="' + R + '" stroke="rgba(127,127,127,.15)" stroke-width="16"/>';
  BUCKETS.forEach(function(k){
    var f = total > 0 ? byB[k.k] / total : 0, len = Math.max(0, f * C - (f > 0 && f < 1 ? 2 : 0));
    h += '<circle cx="75" cy="75" r="' + R + '" stroke="' + k.c + '" stroke-width="16" stroke-dasharray="' + len.toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"/>';
    off += f * C;
    var f2 = (target[k.k] || 0) / 100, l2 = Math.max(0, f2 * C2 - (f2 > 0 && f2 < 1 ? 2 : 0));
    h += '<circle cx="75" cy="75" r="' + r2 + '" stroke="' + k.c + '" stroke-opacity=".45" stroke-width="5" stroke-dasharray="' + l2.toFixed(2) + ' ' + C2.toFixed(2) + '" stroke-dashoffset="' + (-off2).toFixed(2) + '"/>';
    off2 += f2 * C2;
  });
  h += '</g><text x="75" y="72" text-anchor="middle" fill="var(--muted)" style="font:600 9px var(--mono);letter-spacing:.12em">IN MARKET</text>';
  h += '<text x="75" y="92" text-anchor="middle" fill="var(--fg)" style="font:700 20px var(--display)">' + (total > 0 ? Math.round((1 - byB.Cash / total) * 100) : 0) + '%</text></svg>';
  return h;
}

    L.push({i: i, date: ymd(d), amt: a, split: BUCKETS.map(function(k){ return {k: k.k, v: Math.round(a * (V.target[k.k] || 0) / 100)}; })});
    if(s.every === 'week') d.setDate(d.getDate() + 7); else if(s.every === '2w') d.setDate(d.getDate() + 14); else d.setMonth(d.getMonth() + 1);

}

/* ---------- SIGNALS ---------- */
function sma(a, n){ if(a.length < n) return null; var s = 0; for(var i = a.length - n; i < a.length; i++) s += a[i]; return s / n; }
function rsi(c, n){ n = n || 14; if(c.length <= n) return null; var g = 0, l = 0, i, d; for(i = 1; i <= n; i++){ d = c[i] - c[i - 1]; if(d > 0) g += d; else l -= d; } g /= n; l /= n; for(i = n + 1; i < c.length; i++){ d = c[i] - c[i - 1]; g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; } return l === 0 ? 100 : 100 - 100 / (1 + g / l); }
async function loadSignals(force){
  if(!V) return;
  if(!force && Date.now() - MK.sigTs < 10 * 60000 && Object.keys(MK.sig).length){ rSignals(); return; }
  rSignals();
  try{ var j = await getJSON('https://api.alternative.me/fng/?limit=2'); MK.fng = j.data; }catch(e){}
  await Promise.all((V.watch || []).filter(function(a){ return !STABLE[a]; }).map(function(a){
    return getJSON(API + '/klines?symbol=' + a + 'USDT&interval=1d&limit=220').then(function(k){
      var c = k.map(function(r){ return +r[4]; }), h = k.map(function(r){ return +r[2]; }), last = c[c.length - 1];
      var rets = []; for(var i = Math.max(1, c.length - 30); i < c.length; i++) rets.push(Math.log(c[i] / c[i - 1]));
      var m = rets.reduce(function(s, x){ return s + x; }, 0) / (rets.length || 1), vol = Math.sqrt(rets.reduce(function(s, x){ return s + (x - m) * (x - m); }, 0) / Math.max(1, rets.length - 1)) * Math.sqrt(365) * 100;
      var hi90 = Math.max.apply(null, h.slice(-90));
      MK.sig[a] = {c: c.slice(-90), ma50: sma(c, 50), ma200: sma(c, 200), ma50s: c.slice(-90).map(function(_, i){ return sma(c.slice(0, c.length - 90 + i + 1), 50); }), rsi: rsi(c), vol: vol, fromHi: (last / hi90 - 1) * 100, ch7: c.length > 7 ? (last / c[c.length - 8] - 1) * 100 : null, last: last};
    }).catch(function(){ MK.sig[a] = {err: true}; });
  }));
  MK.sigTs = Date.now();
  if(cur === 'signals') rSignals();
}
function spark(s){
  var c = s.c, mn = Math.min.apply(null, c), mx = Math.max.apply(null, c), sp = mx - mn || 1, W = 120, H = 52;
  var pt = function(v, i){ return (i / (c.length - 1) * W).toFixed(1) + ' ' + (4 + (1 - (v - mn) / sp) * (H - 8)).toFixed(1); };
  var d = c.map(function(v, i){ return (i ? 'L' : 'M') + pt(v, i); }).join(' ');
  var m = s.ma50s.map(function(v, i){ return v == null ? '' : ((i && s.ma50s[i - 1] != null) ? 'L' : 'M') + pt(Math.min(mx, Math.max(mn, v)), i); }).join(' ');
  var up = c[c.length - 1] >= c[0];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><path d="' + m + '" fill="none" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="3 3"/><path d="' + d + '" fill="none" stroke="' + (up ? 'var(--up)' : 'var(--down)') + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function rSignals(){
  var el = $('vSignals'); if(!el) return;
  var f = MK.fng && MK.fng[0], fv = f ? +f.value : null;
  var cards = (V.watch || []).filter(function(a){ return !STABLE[a]; }).map(function(a){
    var s = MK.sig[a], t = MK.t[a], p = px(a);
    if(!s) return '<div class="card"><div class="sig-h"><b>' + esc(a) + '</b></div><div class="skel" style="margin-top:12px;width:70%"></div><div class="skel" style="margin-top:8px;width:45%"></div></div>';
    if(s.err) return '<div class="card"><div class="sig-h"><b>' + esc(a) + '</b><span class="small muted">No price history on the feed</span><button class="btn sec sm" data-unw="' + esc(a) + '" type="button" style="margin-left:auto">Remove</button></div></div>';
    var chips = [];
    if(s.ma200) chips.push(s.last > s.ma200 ? '<span class="chip g">Above 200-day avg</span>' : '<span class="chip r">Below 200-day avg</span>');
    else if(s.ma50) chips.push(s.last > s.ma50 ? '<span class="chip g">Above 50-day avg</span>' : '<span class="chip r">Below 50-day avg</span>');
    if(s.ma50 && s.ma200) chips.push('<span class="chip ' + (s.ma50 > s.ma200 ? 'b' : '') + '">50d ' + (s.ma50 > s.ma200 ? 'above' : 'below') + ' 200d</span>');
    if(s.rsi != null) chips.push('<span class="chip ' + (s.rsi >= 70 ? 'y' : s.rsi <= 30 ? 'b' : '') + '">RSI ' + s.rsi.toFixed(0) + (s.rsi >= 70 ? ' · stretched up' : s.rsi <= 30 ? ' · stretched down' : '') + '</span>');
    chips.push('<span class="chip">Vol ' + s.vol.toFixed(0) + '%/yr</span>');
    var al = V.alerts.filter(function(x){ return x.a === a && x.on; }).length;
    return '<div class="card sig"><div><div class="sig-h"><b>' + esc(a) + '</b><span class="num" style="font-weight:600">' + (p ? idrS(p) : '—') + '</span>' + (t ? '<span class="small num ' + cls(t.ch) + '">' + pct(t.ch, 1) + ' 24h</span>' : '') + '</div><div class="small muted num">7d ' + pct(s.ch7, 1) + ' · ' + pct(s.fromHi, 1) + ' from 90-day high</div></div>' + spark(s) +
      '<div class="chips">' + chips.join('') + '</div>' +
      '<div class="row" style="grid-column:1/-1"><button class="btn sec sm" type="button" data-alert="' + esc(a) + '">🔔 ' + (al ? al + ' alert' + (al > 1 ? 's' : '') : 'Price alert') + '</button><button class="btn sec sm" type="button" data-size="' + esc(a) + '">Size a trade</button><button class="btn sec sm" type="button" data-unw="' + esc(a) + '" style="margin-left:auto" aria-label="Remove ' + esc(a) + '">✕</button></div></div>';
  }).join('');
  el.innerHTML =
    '<h1>Signals</h1><p class="sub">Readings from live market data. They describe the market. They are not buy or sell calls.</p>' +
    '<div class="card"><div class="card-h"><h2>Market mood</h2><span class="small faint">Crypto Fear &amp; Greed</span></div>' +
    (fv != null ? '<div class="gauge"><div class="g-num" style="color:' + (fv < 25 ? 'var(--down)' : fv < 45 ? 'var(--warn)' : fv <= 55 ? 'var(--fg)' : 'var(--up)') + '">' + fv + '</div><div style="flex:1"><div style="font-weight:700;margin-bottom:8px">' + esc(f.value_classification) + (MK.fng[1] ? ' <span class="small faint">yesterday ' + MK.fng[1].value + '</span>' : '') + '</div><div class="gtrack"><i style="left:calc(' + fv + '% - 2px)"></i></div></div></div>' : '<div class="skel" style="width:60%"></div>') + '</div>' +
    '<div class="card"><div class="card-h"><h2>Watchlist</h2><button class="btn sec sm" type="button" id="sRef">Refresh</button></div><div class="row"><input class="inp" id="sAdd" placeholder="Add coin, e.g. SOL" autocapitalize="characters" style="flex:1;min-width:0"><button class="btn sm" id="sAddB" type="button">Add</button></div>' +
    '<p class="note">Line = last 90 days; dotted = 50-day average. RSI over 70 or under 30 means the price moved fast in one direction lately.</p></div>' + cards +
    (V.alerts.length ? '<div class="card"><div class="card-h"><h2>Alerts</h2><span class="small faint">checked every 20s while open</span></div>' + V.alerts.map(function(x, i){ return '<div class="al"><span><b>' + esc(x.a) + '</b> ' + (x.dir === 'above' ? 'above' : 'below') + ' <span class="num">' + idrS(x.px) + '</span>' + (x.on ? '' : ' <span class="chip g">hit ' + esc(x.hit || '') + '</span>') + '</span><button class="btn sec sm" data-delal="' + i + '" type="button">✕</button></div>'; }).join('') + '</div>' : '');
  $('sRef').onclick = function(){ MK.sig = {}; loadSignals(true); };
  $('sAddB').onclick = function(){ var a = $('sAdd').value.trim().toUpperCase(); if(!a) return; if(V.watch.indexOf(a) < 0){ V.watch.push(a); save(); } MK.sigTs = 0; loadSignals(true); refreshOne(a); };
  el.querySelectorAll('[data-unw]').forEach(function(b){ b.onclick = function(){ V.watch = V.watch.filter(function(x){ return x !== b.getAttribute('data-unw'); }); save(); rSignals(); }; });
  el.querySelectorAll('[data-alert]').forEach(function(b){ b.onclick = function(){ alertSheet(b.getAttribute('data-alert')); }; });
  el.querySelectorAll('[data-size]').forEach(function(b){ b.onclick = function(){ RK = {asset: b.getAttribute('data-size'), ex: (RK && RK.ex) || 'Indodax', entry: px(b.getAttribute('data-size')) || '', stop:'', target:'', risk: V.risk || 1}; $('vRisk').innerHTML = ''; go('risk'); }; });
  el.querySelectorAll('[data-delal]').forEach(function(b){ b.onclick = function(){ V.alerts.splice(+b.getAttribute('data-delal'), 1); save(); rSignals(); }; });
}
function alertSheet(a){
  var p = px(a);
  sheet('<div class="sh-h"><h2>' + esc(a) + ' price alert</h2><button class="ibtn" data-close type="button" aria-label="Close">✕</button></div><div class="form"><p class="muted" style="margin:0">Now ' + (p ? idr(p) : '—') + '</p><div class="seg" id="aDir"><button type="button" data-v="above" class="on">Goes above</button><button type="button" data-v="below">Falls below</button></div><label class="f">Price (IDR)<input class="inp" id="aPx" inputmode="decimal" value="' + (p ? fmtP(p * 1.05) : '') + '"></label><button class="btn full" id="aGo" type="button">Set alert</button><p class="note">Alerts ring while Intelligence is open (also as a phone notification if you allow it). A closed page can’t check prices.</p></div>');
  var dir = 'above';
  $('aDir').onclick = function(e){ var b = e.target.closest('button'); if(!b) return; dir = b.getAttribute('data-v'); $('aDir').querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); }); if(p) $('aPx').value = fmtP(p * (dir === 'above' ? 1.05 : .95)); };
  $('aGo').onclick = function(){ var v = numIn($('aPx').value); if(!(v > 0)){ toast('Enter a price'); return; } V.alerts.push({a: a, dir: dir, px: v, on: true}); save(); closeSheet(); toast('Alert set'); try{ if(window.Notification && Notification.permission === 'default') Notification.requestPermission(); }catch(e){} rSignals(); };
}
function checkAlerts(){
  if(!V) return;
  V.alerts.forEach(function(x){
    if(!x.on) return; var p = px(x.a); if(!p) return;
    if((x.dir === 'above' && p >= x.px) || (x.dir === 'below' && p <= x.px)){
      x.on = false; x.hit = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); save();
      var m = x.a + ' is ' + (x.dir === 'above' ? 'above ' : 'below ') + idrS(x.px) + ' (now ' + idrS(p) + ')';
      toast('🔔 ' + m); vibe([100, 60, 100]);
      try{ if(window.Notification && Notification.permission === 'granted') new Notification('IBRAZ Intelligence', {body: m, icon: '/icon-192.png', tag: 'ii-' + x.a}); }catch(e){}
    }
  });
}

/* ---------- sheet + settings ---------- */
function sheet(html){ $('shBody').innerHTML = html; $('sheet').classList.add('on'); $('shBody').querySelectorAll('[data-close]').forEach(function(b){ b.onclick = closeSheet; }); }
function closeSheet(){ $('sheet').classList.remove('on'); }
$('sheet').addEventListener('click', function(e){ if(e.target === $('sheet')) closeSheet(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSheet(); });
$('btnSet').addEventListener('click', settings);
function settings(){
  var hasFace = !!(META && META.face);
  sheet('<div class="sh-h"><h2>Settings</h2><button class="ibtn" data-close type="button" aria-label="Close">✕</button></div>' +
    '<div class="set-row"><div><b>Face unlock</b><div class="small muted">' + (!FACE_OK ? 'Not available in this browser' : hasFace ? 'On' + (META.face.mode === 'prf' ? ' · face key encrypts your data' : ' · unlocks a key kept on this device') : 'Off') + '</div></div>' + (FACE_OK ? '<button class="btn ' + (hasFace ? 'sec' : '') + ' sm" id="stFace" type="button">' + (hasFace ? 'Turn off' : 'Turn on') + '</button>' : '') + '</div>' +
    '<div class="set-row"><div><b>Change PIN</b><div class="small muted">6 digits</div></div><button class="btn sec sm" id="stPin" type="button">Change</button></div>' +
    '<div class="set-row"><div><b>Auto-lock</b><div class="small muted">After no taps for</div></div><select class="inp" id="stAuto" style="width:auto"><option value="1">1 min</option><option value="5">5 min</option><option value="15">15 min</option></select></div>' +
    '<div class="set-row" style="display:block"><b>Fees &amp; tax per exchange</b><div class="small muted" style="margin:4px 0 8px">Set these to what your app actually charges. Tax applies on sells: 0.21% on licensed Indonesian exchanges, 1% self-reported for foreign ones (PMK 50/2025).</div><div class="fee-row small faint"><span></span><span>Fee %</span><span>Tax %</span></div>' + EXCH.map(function(x){ var f = V.fees[x] || {fee:0, tax:0}; return '<div class="fee-row"><span>' + x + '</span><input class="inp num" type="number" step="0.01" min="0" data-fx="' + x + '" data-fk="fee" value="' + f.fee + '"><input class="inp num" type="number" step="0.01" min="0" data-fx="' + x + '" data-fk="tax" value="' + f.tax + '"></div>'; }).join('') + '</div>' +
    '<div class="set-row"><div><b>Backup</b><div class="small muted">An encrypted file. It opens only with your PIN. Use it to move to a new phone or to share with your husband.</div></div></div><div class="row"><button class="btn sec sm" id="stExp" type="button">Download backup</button><button class="btn sec sm" id="stImp" type="button">Restore a backup</button></div>' +
    '<div class="set-row"><div><b>Theme</b></div><button class="btn sec sm" id="stTheme" type="button">' + (document.documentElement.getAttribute('data-theme') === 'light' ? 'Dark' : 'Light') + '</button></div>' +
    '<div class="set-row"><div><b>Erase this device</b><div class="small muted">Deletes all Intelligence data here.</div></div><button class="btn dan sm" id="stErase" type="button">Erase</button></div>' +
    '<p class="note">Everything is encrypted (AES-256) and stays on this device. Nothing is sent anywhere except public price requests.</p>');
  $('stAuto').value = String(V.autolock || 5);
  $('stAuto').onchange = function(){ V.autolock = +this.value; save(); };
  document.querySelectorAll('[data-fx]').forEach(function(i){ i.onchange = function(){ var x = i.getAttribute('data-fx'); V.fees[x] = V.fees[x] || {fee:0, tax:0}; V.fees[x][i.getAttribute('data-fk')] = Math.max(0, +i.value || 0); save(); }; });
  if($('stFace')) $('stFace').onclick = async function(){
    if(hasFace){ disableFace(); toast('Face unlock is off'); settings(); return; }
    try{ await enableFace(); toast('Face unlock is on'); }catch(e){ toast(e && e.name === 'NotAllowedError' ? 'Cancelled' : 'Couldn’t turn on Face unlock'); }
    settings();
  };
  $('stPin').onclick = pinSheet;
  $('stExp').onclick = function(){
    saveVault().then(function(){
      var j = {kind:'ibraz-intelligence-backup', v:1, at: Date.now(), meta: {salt: META.salt, pinWrap: META.pinWrap}, vault: lsGet(K_VAULT)};
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(j)], {type:'application/json'}));
      a.download = 'ibraz-intelligence-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('Backup downloaded');
    });
  };
  $('stImp').onclick = function(){ $('fileIn').click(); };
  $('stTheme').onclick = function(){ var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem('ibraz-theme', t); }catch(e){} settings(); };
  $('stErase').onclick = function(){
    sheet('<div class="sh-h"><h2>Erase everything?</h2></div><p class="muted">Your plan, journal and settings on this device will be gone. Download a backup first if you might need them.</p><label class="f">Type ERASE to confirm<input class="inp" id="erT" autocapitalize="characters"></label><div class="row" style="margin-top:14px"><button class="btn dan" id="erGo" type="button">Erase</button><button class="btn sec" data-close type="button">Cancel</button></div>');
    $('erGo').onclick = function(){ if($('erT').value.trim().toUpperCase() !== 'ERASE') return; localStorage.removeItem(K_META); localStorage.removeItem(K_VAULT); localStorage.removeItem('ii-fail'); idbDel('face'); META = null; lock(); toast('Erased'); };
  };
}
function pinSheet(){
  sheet('<div class="sh-h"><h2>Change PIN</h2><button class="ibtn" data-close type="button" aria-label="Close">✕</button></div><div class="form"><label class="f">New 6-digit PIN<input class="inp" id="pn1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label><label class="f">Again<input class="inp" id="pn2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label><button class="btn full" id="pnGo" type="button">Save PIN</button><p class="note">Backups made before this still open with the old PIN.</p></div>');
  $('pnGo').onclick = async function(){
    var a = $('pn1').value, b = $('pn2').value;
    if(!/^\d{6}$/.test(a)){ toast('Use exactly 6 digits'); return; } if(a !== b){ toast('PINs don’t match'); return; }
    this.disabled = true; var salt = rnd(16);
    META.salt = b64(salt); META.pinWrap = await seal(await pinKey(a, salt), RAW); saveMeta();
    closeSheet(); toast('PIN changed');
  };
}

/* ---------- start ---------- */
mode = META && META.pinWrap ? 'pin' : 'setup1';
paintLock();
if(META && META.face) setTimeout(function(){ if(mode === 'pin' && !$('lock').classList.contains('out')) faceUnlock(true); }, 450);
window.__ii = {press: press, state: function(){ return {mode: mode, unlocked: !!DEK, V: V}; }, lock: lock};
})();
